[project]
name = "ComfyUI"
version = "0.40.0"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.13.*"
dependencies = [
    # Core ComfyUI dependencies (auto-synced from ComfyUI/requirements.txt)
    "comfyui-frontend-package==1.55.17",
    "comfyui-workflow-templates==0.11.82",
    "comfyui-embedded-docs==0.5.14",
    "torch",
    "torchsde",
    "torchvision",
    "numpy>=1.25.0",
    "einops",
    "transformers>=4.50.3",
    "tokenizers>=0.13.3",
    "sentencepiece",
    "safetensors>=0.4.2",
    "aiohttp>=3.11.8",
    "yarl>=1.18.0",
    "pyyaml",
    "Pillow",
    "scipy",
    "tqdm",
    "psutil",
    "alembic",
    "SQLAlchemy>=2.0.0",
    "filelock",
    "av>=17.0.0",
    "comfy-kitchen==0.2.37",
    "comfy-aimdo==0.5.6",
    "requests",
    "simpleeval>=1.0.0",
    "blake3",
    "kornia>=0.7.1",
    "spandrel",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "PyOpenGL>=3.1.8",
    "comfy-angle",

    # Additional custom node dependencies (from wrapper_config.toml)
    "torchaudio",
    "colour-science>=0.4.4",
    "comfyui-manager",
    "gitpython",
    "pygithub",
    "opencv-python",
    "kornia",
    "onnxruntime",
    "hydra-core",
    "segment-anything",
    "matplotlib",
    "accelerate",
    "scikit-image",
    "scikit-learn",
    "gdown",
    "deepdiff",
    "lark",
    "gguf",
    "groundingdino-py",
    "supervision",
    "ultralytics",
    "timm",
    "peft",
    "color-matcher",
    "piexif",
    "dill",
    "iopath",
    "diffusers",
    "torchlanc",
    "py-cpuinfo",
    "ftfy",
    "nvidia-ml-py",
    "imageio-ffmpeg",
    "ninja",
    "pywavelets",
    "sam-2 @ git+https://github.com/facebookresearch/sam2",
    "cache-dit",
    "onnxruntime-gpu",
    "soundfile",
    "numpy>=2.0.0",
    "rotary-embedding-torch",
    "edge-tts",
    "kokoro-onnx",
    "snac",
    "noisereduce",
    "hyperpyyaml",
    "modelscope",
    "openai-whisper",
    "inflect",
    "wetext",
    "conformer",
    "pyworld",
    "munch",
    "librosa>=0.10.2",
    "moviepy",

    # Platform-specific dependencies (Windows)
    "insightface @ https://github.com/Gourieff/Assets/raw/main/Insightface/insightface-0.7.3-cp313-cp313-win_amd64.whl",
    "sageattention @ https://github.com/woct0rdho/SageAttention/releases/download/v2.2.0-windows.post4/sageattention-2.2.0%2Bcu130torch2.9.0andhigher.post4-cp39-abi3-win_amd64.whl",
    "spas-sage-attn @ https://github.com/woct0rdho/SpargeAttn/releases/download/v0.1.0-windows.post4/spas_sage_attn-0.1.0%2Bcu130torch2.9.0andhigher.post4-cp39-abi3-win_amd64.whl",
    "triton-windows>=3.6.0",
    "decord2 @ https://github.com/Kraven1109/ComfyUI-Wrapper/releases/download/v3.0.0-decord2/decord2-3.0.0%2Bwin.x64.cpu-py3-none-any.whl",
]

[project.urls]
homepage = "https://www.comfy.org/"
repository = "https://github.com/comfyanonymous/ComfyUI"
documentation = "https://docs.comfy.org/"

[tool.ruff]
lint.select = [
  "N805", # invalid-first-argument-name-for-method
  "S307", # suspicious-eval-usage
  "S102", # exec
  "E",
  "T",    # print-usage
  "W",
  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
  # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
  "F",
]

lint.ignore = ["E501", "E722", "E731", "E712", "E402", "E741"]

exclude = ["*.ipynb", "**/generated/*.pyi"]

[tool.pylint]
master.py-version = "3.10"
master.extension-pkg-allow-list = [
  "pydantic",
]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "line-too-long",
  "too-few-public-methods",
  "too-many-public-methods",
  "too-many-instance-attributes",
  "too-many-positional-arguments",
  "broad-exception-raised",
  "too-many-lines",
  "invalid-name",
  "unused-argument",
  "broad-exception-caught",
  "consider-using-with",
  "fixme",
  "too-many-statements",
  "too-many-branches",
  "too-many-locals",
  "too-many-arguments",
  "too-many-return-statements",
  "too-many-nested-blocks",
  "duplicate-code",
  "abstract-method",
  "superfluous-parens",
  "arguments-differ",
  "redefined-builtin",
  "unnecessary-lambda",
  "dangerous-default-value",
  "invalid-overridden-method",
  # next warnings should be fixed in future
  "bad-classmethod-argument",  # Class method should have 'cls' as first argument
  "wrong-import-order",  # Standard imports should be placed before third party imports
  "ungrouped-imports",
  "unnecessary-pass",
  "unnecessary-lambda-assignment",
  "no-else-return",
  "unused-variable",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-test-cu132"
url = "https://download.pytorch.org/whl/test/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
torchaudio = { index = "pytorch-test-cu132" }

[tool.uv]
find-links = ["../../wheels"]
environments = ["sys_platform == 'win32'"]
override-dependencies = []

[tool.uv.extra-build-dependencies]
groundingdino-py = ["torch"]
