# Wrapper configuration for ComfyUI workspace
# Single Source of Truth — Run `comfy sync` after editing.

[pytorch]
index_name = "pytorch-cu132"
index_url = "https://download.pytorch.org/whl/cu132"
torchaudio_index_name = "pytorch-test-cu132"
torchaudio_index_url = "https://download.pytorch.org/whl/test/cu132"

[dependencies]
# Default Python version across all platforms (can still be overridden per-OS below)
python = "==3.13.*"

# Additional custom node dependencies (common to all platforms)
custom = [
    # --- Core & Manager ---
    "comfyui-manager",
    "gitpython",
    "pygithub",
    "accelerate",
    "diffusers",
    "peft",
    "timm",
    "gguf",
    "cache-dit",
    "rotary-embedding-torch",  # Required by seedvr2_videoupscaler

    # --- Math, Tensors & Hardware Telemetry ---
    "numpy>=2.0.0",            # Required for ml_dtypes float4_e2m1fn (InsightFace/ReActor)
    "scipy",
    "scikit-image",
    "scikit-learn",
    "kornia",
    "torchlanc",
    "pywavelets",              # Required for RES4LYF custom node
    "nvidia-ml-py",
    "py-cpuinfo",
    "ninja",                   # Required for JIT compiling custom CUDA kernels

    # --- Vision, Detection & Segmentation ---
    "opencv-contrib-python",   # Full OpenCV (replaces bare opencv-python; headless blocked via override)
    "onnxruntime-gpu",         # GPU ONNX runtime (CPU onnxruntime blocked via override to prevent clobbering)
    "ultralytics",
    "supervision",
    "segment-anything",
    "sam-2 @ git+https://github.com/facebookresearch/sam2",
    "groundingdino-py",
    "colour-science>=0.4.4",   # Required by ComfyUI-LTXVideo HDR color primaries
    "color-matcher",
    "piexif",
    "imageio-ffmpeg",
    "matplotlib",

    # --- Audio, TTS & Video Processing (WanVideo, CosyVoice3, TTSS, Seed-VC) ---
    "torchaudio",
    "soundfile",
    "librosa>=0.10.2",
    "moviepy<2.0.0",           # Pinned <2.0 to preserve `moviepy.editor` for custom nodes
    "edge-tts",                # Microsoft Edge TTS
    "kokoro-onnx",             # Lightweight neural TTS (ONNX)
    "snac",                    # Orpheus TTS codec
    "noisereduce",             # Audio denoising & studio speech enhancement
    "openai-whisper",          # CosyVoice transcription & alignment
    "modelscope",              # CosyVoice model downloader
    "hyperpyyaml",             # CosyVoice YAML parser
    "conformer",               # CosyVoice Matcha decoder layer
    "pyworld",                 # CosyVoice pitch & duration feature extractor
    "wetext",                  # CosyVoice text processing
    "inflect",                 # CosyVoice text normalization

    # --- Utilities & Serialization ---
    "hydra-core",
    "omegaconf",
    "gdown",
    "deepdiff",
    "lark",
    "dill",
    "iopath",
    "ftfy",
    "munch",
]

# Windows-specific dependencies (installed on Windows only)
[dependencies.windows]
# Pre-built community wheel for Python 3.13 (win_amd64) to bypass MSVC compilation
insightface = "https://github.com/Gourieff/Assets/raw/main/Insightface/insightface-0.7.3-cp313-cp313-win_amd64.whl"
# SageAttention & SpargeAttn (Windows-optimized stable ABI wheels)
sageattention = "https://github.com/woct0rdho/SageAttention/releases/download/v2.2.0-windows.post4/sageattention-2.2.0%2Bcu130torch2.9.0andhigher.post4-cp39-abi3-win_amd64.whl"
spas-sage-attn = "https://github.com/woct0rdho/SpargeAttn/releases/download/v0.1.0-windows.post4/spas_sage_attn-0.1.0%2Bcu130torch2.9.0andhigher.post4-cp39-abi3-win_amd64.whl"
triton-windows = ">=3.6.0"
# decord2 for video decoding (pre-built Windows wheel with FFmpeg bundled)
decord2 = "https://github.com/Kraven1109/ComfyUI-Wrapper/releases/download/v3.0.0-decord2/decord2-3.0.0%2Bwin.x64.cpu-py3-none-any.whl"

# Linux-specific dependencies (installed on Linux only)
[dependencies.linux]
insightface = ">=0.7.3"
decord2 = ">=3.0.0"
# Pre-built wheels resolved from ../../wheels via find-links
sageattention = ">=2.2.0"
spas-sage-attn = ">=0.1.0"

[uv]
# Prevent transitive dependencies (e.g. insightface, kokoro-onnx, supervision) from installing
# CPU onnxruntime or redundant opencv packages that clobber GPU/contrib namespaces:
override_dependencies = [
    "onnxruntime; sys_platform == 'never'",
    "opencv-python; sys_platform == 'never'",
    "opencv-python-headless; sys_platform == 'never'",
    "opencv-contrib-python-headless; sys_platform == 'never'",
]

# Extra build dependencies for sdist packages that require torch/cython/setuptools at compile time.
# Top-level keys apply to ALL platforms; [uv.extra_build_deps.<os>] overrides per platform.
[uv.extra_build_deps]
groundingdino-py = ["torch", "setuptools", "wheel"]
pyworld = ["cython", "numpy", "setuptools", "wheel"]

[uv.extra_build_deps.linux]
insightface = ["cython", "numpy", "setuptools", "wheel"]

[uv.extra_build_deps.windows]
